name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Golden-file comparison. No secrets, no real credentials, no artifacts.
      - name: Run tests
        run: node test/run.mjs

      - name: Verify vendored file checksums
        working-directory: docs/vendor
        run: sha256sum --check CHECKSUMS
